<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · 长图浏览</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111;
    --text: #fff;
    --text-secondary: rgba(255,255,255,0.55);
    --placeholder: #c8c8c8;
    --card-w: 500px;
    --card-h: 84vh;
    --topbar-h: 52px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: rgba(17,17,17,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 200;
  }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .topbar-counter {
    font-size: 14px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .topbar-counter .current {
    color: var(--text);
    font-weight: 700;
    font-size: 17px;
  }

  /* ===== 查看器 ===== */
  .viewer {
    position: fixed;
    top: var(--topbar-h);
    left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: grab;
    perspective: 1400px;
    -webkit-perspective: 1400px;
    touch-action: pan-y;
  }
  .viewer.dragging { cursor: grabbing; }

  .track {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }

  /* ===== 卡片 ===== */
  .card {
    position: absolute;
    top: 50%; left: 50%;
    width: var(--card-w);
    height: var(--card-h);
    margin-left: calc(var(--card-w) / -2);
    margin-top: calc(var(--card-h) / -2);
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    will-change: transform, opacity;
    transition:
      transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1),
      opacity 0.5s ease;
  }
  .card.dragging { transition: none; }

  .card-inner {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    background-color: var(--placeholder);
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.18) 1px, transparent 1px);
    background-size: 50px 50px;
    border-radius: 6px;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.4),
      0 20px 60px rgba(0,0,0,0.5);
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.25) transparent;
  }
  .card-inner::-webkit-scrollbar { width: 6px; }
  .card-inner::-webkit-scrollbar-track { background: transparent; }
  .card-inner::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.25);
    border-radius: 3px;
  }

  /* 长图内容 */
  .card-content {
    width: 100%;
    min-height: 20000px;
    position: relative;
  }

  .card-label {
    position: sticky;
    top: 36px;
    display: block;
    text-align: center;
    padding-top: 36px;
    font-size: 18px;
    font-weight: 800;
    color: rgba(0,0,0,0.45);
    letter-spacing: 0.02em;
    z-index: 2;
  }
  .card-dim {
    position: sticky;
    top: 72px;
    display: block;
    text-align: center;
    font-size: 13px;
    color: rgba(0,0,0,0.3);
    margin-top: 8px;
    z-index: 2;
  }

  /* ===== 右下角鸟瞰缩略图 ===== */
  .minimap {
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 46px;
    height: 170px;
    background: rgba(0,0,0,0.6);
    border-radius: 5px;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    pointer-events: auto;
    cursor: pointer;
  }
  .minimap-track {
    position: absolute;
    top: 22px;
    left: 4px;
    right: 4px;
    bottom: 6px;
    background-color: rgba(200,200,200,0.15);
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 6px 6px;
    border-radius: 2px;
    overflow: hidden;
  }
  .minimap-viewport {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(64, 156, 255, 0.45);
    border: 1px solid rgba(64, 156, 255, 0.9);
    border-radius: 2px;
    pointer-events: none;
    transition: top 0.08s linear, height 0.08s linear;
  }
  .minimap-label {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    letter-spacing: 0.05em;
    background: rgba(0,0,0,0.3);
  }
  .minimap-pct {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 8px;
    color: rgba(255,255,255,0.5);
    line-height: 1.4;
  }

  /* ===== 底部提示 ===== */
  .bottom-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 7px 18px;
    border-radius: 100px;
    z-index: 150;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    :root { --card-w: 360px; --card-h: 80vh; }
    .minimap { width: 38px; height: 140px; bottom: 10px; right: 10px; }
  }
  @media (max-width: 600px) {
    :root { --card-w: 280px; --card-h: 76vh; }
    .topbar { padding: 0 16px; }
    .topbar-title { font-size: 13px; }
    .bottom-hint { font-size: 11px; padding: 5px 12px; }
    .minimap { width: 32px; height: 120px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">作品集 · 长图浏览</div>
  <div class="topbar-counter">
    <span class="current" id="currentNum">01</span>
    <span> / </span>
    <span id="totalNum">50</span>
  </div>
</header>

<main class="viewer" id="viewer">
  <div class="track" id="track"></div>
</main>

<div class="bottom-hint">滚轮上下滚动查看长图 · 按住左键左右拖动切换图片</div>

<script>
(function () {
  "use strict";

  var TOTAL = 50;
  var CONTENT_HEIGHT = 20000;

  var current = 0;
  var dragOffset = 0;
  var isDragging = false;
  var pointerId = null;
  var startX = 0;
  var dragMoved = false;
  var suppressClick = false;

  var viewer = document.getElementById("viewer");
  var track = document.getElementById("track");
  var currentNumEl = document.getElementById("currentNum");
  var totalNumEl = document.getElementById("totalNum");

  totalNumEl.textContent = pad2(TOTAL);

  function pad2(n) { return String(n).padStart(2, "0"); }

  // ===== 创建卡片 =====
  var cards = [];
  var cardInners = [];

  for (var i = 0; i < TOTAL; i++) {
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.index = i;

    var inner = document.createElement("div");
    inner.className = "card-inner";

    var content = document.createElement("div");
    content.className = "card-content";
    content.innerHTML =
      '<span class="card-label">长图 ' + pad2(i + 1) + ' / ' + pad2(TOTAL) + '</span>' +
      '<span class="card-dim">790 × 20000 px · 灰色网格</span>';

    // 鸟瞰缩略图
    var minimap = document.createElement("div");
    minimap.className = "minimap";
    minimap.innerHTML =
      '<div class="minimap-label">鸟瞰图</div>' +
      '<div class="minimap-track">' +
        '<div class="minimap-viewport"></div>' +
      '</div>' +
      '<div class="minimap-pct">0%</div>';

    inner.appendChild(content);
    inner.appendChild(minimap);
    card.appendChild(inner);
    track.appendChild(card);

    cards.push(card);
    cardInners.push(inner);

    // 点击切换
    (function (idx) {
      card.addEventListener("click", function (e) {
        if (suppressClick) { e.stopPropagation(); return; }
        // 忽略点击在鸟瞰图上的情况
        if (e.target.closest(".minimap")) return;
        goTo(idx);
      });
    })(i);

    // 鸟瞰图点击跳转
    (function (innerEl, minimapEl) {
      minimapEl.addEventListener("click", function (e) {
        e.stopPropagation();
        var trackEl = minimapEl.querySelector(".minimap-track");
        var rect = trackEl.getBoundingClientRect();
        var ratio = (e.clientY - rect.top) / rect.height;
        innerEl.scrollTop = ratio * CONTENT_HEIGHT;
      });
      // 鸟瞰图拖动
      var minimapDragging = false;
      minimapEl.addEventListener("mousedown", function (e) {
        e.stopPropagation();
        minimapDragging = true;
        var trackEl = minimapEl.querySelector(".minimap-track");
        function onMove(ev) {
          if (!minimapDragging) return;
          var rect = trackEl.getBoundingClientRect();
          var ratio = Math.max(0, Math.min(1, (ev.clientY - rect.top) / rect.height));
          innerEl.scrollTop = ratio * CONTENT_HEIGHT;
        }
        function onUp() {
          minimapDragging = false;
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        }
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    })(inner, minimap);

    // 滚动更新鸟瞰图
    (function (innerEl, minimapEl) {
      innerEl.addEventListener("scroll", function () {
        updateMinimap(innerEl, minimapEl);
      });
    })(inner, minimap);
  }

  // 更新鸟瞰图指示器
  function updateMinimap(innerEl, minimapEl) {
    var viewport = minimapEl.querySelector(".minimap-viewport");
    var pctEl = minimapEl.querySelector(".minimap-pct");
    var trackEl = minimapEl.querySelector(".minimap-track");
    if (!viewport || !trackEl) return;

    var scrollTop = innerEl.scrollTop;
    var viewH = innerEl.clientHeight;
    var totalH = CONTENT_HEIGHT;
    var trackH = trackEl.clientHeight;

    var vpTop = (scrollTop / totalH) * trackH;
    var vpHeight = Math.max(4, (viewH / totalH) * trackH);
    if (vpTop + vpHeight > trackH) vpHeight = trackH - vpTop;

    viewport.style.top = vpTop.toFixed(1) + "px";
    viewport.style.height = vpHeight.toFixed(1) + "px";

    var pct = Math.min(100, Math.round((scrollTop / (totalH - viewH)) * 100));
    if (pctEl) pctEl.textContent = pct + "%";
  }

  // ===== 布局计算 =====
  function getCardWidth() {
    var w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--card-w"));
    return isNaN(w) ? 500 : w;
  }

  function layout() {
    var cardW = getCardWidth();
    var spacing = cardW * 0.52;
    var centerPos = current + dragOffset / spacing;

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var d = i - centerPos;
      var absD = Math.abs(d);

      if (absD > 7) {
        card.style.opacity = "0";
        card.style.pointerEvents = "none";
        card.style.transform = "translateX(" + (d * spacing).toFixed(1) + "px) scale(0.15)";
        continue;
      }

      var scale = Math.max(0.2, 1 - absD * 0.21);
      var tx = d * spacing;
      var opacity = Math.max(0, 1 - absD * 0.16);
      var z = 1000 - Math.round(absD * 100);
      var rotY = d * -5;

      card.style.opacity = opacity.toFixed(3);
      card.style.zIndex = z;
      card.style.pointerEvents = absD < 2.8 ? "auto" : "none";
      card.style.transform =
        "translateX(" + tx.toFixed(1) + "px) " +
        "scale(" + scale.toFixed(4) + ") " +
        "rotateY(" + rotY.toFixed(1) + "deg)";
    }

    var displayIdx = Math.max(0, Math.min(TOTAL - 1, Math.round(centerPos)));
    currentNumEl.textContent = pad2(displayIdx + 1);
  }

  // ===== 切换 =====
  function goTo(idx) {
    idx = Math.max(0, Math.min(TOTAL - 1, idx));
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("dragging");
    current = idx;
    dragOffset = 0;
    layout();
    // 更新新居中卡片的鸟瞰图
    if (cardInners[current]) {
      var mm = cards[current].querySelector(".minimap");
      if (mm) updateMinimap(cardInners[current], mm);
    }
  }

  // ===== 拖动（Pointer Events，更 robust） =====
  viewer.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    // 忽略鸟瞰图上的按下
    if (e.target.closest(".minimap")) return;

    isDragging = true;
    pointerId = e.pointerId;
    dragMoved = false;
    startX = e.clientX;
    dragOffset = 0;
    viewer.classList.add("dragging");
    for (var i = 0; i < cards.length; i++) cards[i].classList.add("dragging");

    try { viewer.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  viewer.addEventListener("pointermove", function (e) {
    if (!isDragging || e.pointerId !== pointerId) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 4) dragMoved = true;
    if (dragMoved) {
      dragOffset = dx;
      layout();
    }
  });

  function endDrag(e) {
    if (!isDragging) return;
    if (e && e.pointerId !== pointerId) return;

    isDragging = false;
    pointerId = null;
    viewer.classList.remove("dragging");

    var cardW = getCardWidth();
    var spacing = cardW * 0.52;
    var threshold = spacing * 0.3;

    var target = current;
    // 方向修正：向右拖 → 下一张，向左拖 → 上一张
    if (dragOffset > threshold) target = current + 1;
    else if (dragOffset < -threshold) target = current - 1;

    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("dragging");
    current = Math.max(0, Math.min(TOTAL - 1, target));
    dragOffset = 0;
    layout();

    // 抑制拖动后的误点击
    if (dragMoved) {
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 120);
    }
    dragMoved = false;
  }

  viewer.addEventListener("pointerup", endDrag);
  viewer.addEventListener("pointercancel", endDrag);
  viewer.addEventListener("lostpointercapture", function (e) {
    if (isDragging) endDrag(e);
  });

  // ===== 滚轮：居中卡片内部滚动 =====
  viewer.addEventListener("wheel", function (e) {
    if (isDragging) return;
    e.preventDefault();
    var inner = cardInners[current];
    if (inner) {
      inner.scrollTop += e.deltaY;
    }
  }, { passive: false });

  // ===== 触摸滑动（移动端） =====
  var touchStartX = 0, touchMoved = false;
  viewer.addEventListener("touchstart", function (e) {
    if (e.target.closest(".minimap")) return;
    touchStartX = e.touches[0].clientX;
    touchMoved = false;
    for (var i = 0; i < cards.length; i++) cards[i].classList.add("dragging");
  }, { passive: true });

  viewer.addEventListener("touchmove", function (e) {
    if (e.target.closest(".minimap")) return;
    var dx = e.touches[0].clientX - touchStartX;
    if (Math.abs(dx) > 8) {
      touchMoved = true;
      dragOffset = dx;
      layout();
      e.preventDefault();
    }
  }, { passive: false });

  viewer.addEventListener("touchend", function () {
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("dragging");
    if (touchMoved) {
      var cardW = getCardWidth();
      var spacing = cardW * 0.52;
      var threshold = spacing * 0.3;
      var target = current;
      if (dragOffset > threshold) target = current + 1;
      else if (dragOffset < -threshold) target = current - 1;
      current = Math.max(0, Math.min(TOTAL - 1, target));
      dragOffset = 0;
      layout();
      touchMoved = false;
    }
  });

  // ===== 键盘 =====
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); goTo(current + 1); }
  });

  // ===== 窗口缩放 =====
  window.addEventListener("resize", function () {
    layout();
    if (cardInners[current]) {
      var mm = cards[current].querySelector(".minimap");
      if (mm) updateMinimap(cardInners[current], mm);
    }
  });

  // 初始化
  layout();
  // 初始化第一张的鸟瞰图
  if (cardInners[0]) {
    var mm0 = cards[0].querySelector(".minimap");
    if (mm0) updateMinimap(cardInners[0], mm0);
  }
})();
</script>

</body>
</html>
