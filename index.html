<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · 长图浏览</title>
<style>
  /* ===== 基础重置 ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f0f0;
    --viewer-bg: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #888;
    --arrow-bg: rgba(255,255,255,0.9);
    --arrow-hover: #fff;
    --arrow-disabled: rgba(200,200,200,0.5);
    --placeholder: #c8c8c8;
    --placeholder-text: #999;
    --topbar-height: 56px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--topbar-height);
    background: rgba(240,240,240,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #d8d8d8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }

  .topbar-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topbar-counter {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .topbar-counter .current {
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
  }

  /* ===== 主查看区 ===== */
  .viewer {
    position: fixed;
    top: var(--topbar-height);
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }

  /* 图片滚动容器 */
  .image-container {
    flex: 1;
    display: flex;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .image-container::-webkit-scrollbar {
    width: 8px;
  }
  .image-container::-webkit-scrollbar-track {
    background: transparent;
  }
  .image-container::-webkit-scrollbar-thumb {
    background: #bbb;
    border-radius: 4px;
  }
  .image-container::-webkit-scrollbar-thumb:hover {
    background: #999;
  }

  /* 长图占位 —— 790 x 20000 */
  .long-image {
    width: 790px;
    max-width: 100%;
    min-height: 20000px;
    background: var(--placeholder);
    position: relative;
    flex-shrink: 0;
  }

  .long-image .label {
    position: sticky;
    top: 40px;
    display: inline-block;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 40px;
    padding: 12px 28px;
    background: rgba(255,255,255,0.7);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 600;
    color: var(--placeholder-text);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .long-image .dimensions {
    position: sticky;
    top: 100px;
    display: block;
    text-align: center;
    font-size: 13px;
    color: var(--placeholder-text);
    margin-top: 8px;
  }

  /* ===== 左右箭头 ===== */
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--arrow-bg);
    border: 1px solid #d0d0d0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 50;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }

  .nav-arrow:hover:not(.disabled) {
    background: var(--arrow-hover);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    transform: translateY(-50%) scale(1.08);
  }

  .nav-arrow:active:not(.disabled) {
    transform: translateY(-50%) scale(0.95);
  }

  .nav-arrow.disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: var(--arrow-disabled);
  }

  .nav-arrow.left {
    left: 20px;
  }

  .nav-arrow.right {
    right: 20px;
  }

  .nav-arrow svg {
    width: 24px;
    height: 24px;
    stroke: #333;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ===== 底部缩略指示 ===== */
  .bottom-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.8);
    padding: 6px 16px;
    border-radius: 100px;
    z-index: 50;
    pointer-events: none;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .topbar { padding: 0 16px; }
    .topbar-title { font-size: 14px; }
    .nav-arrow {
      width: 44px;
      height: 44px;
    }
    .nav-arrow.left { left: 8px; }
    .nav-arrow.right { right: 8px; }
    .nav-arrow svg { width: 20px; height: 20px; }
    .long-image .label { font-size: 15px; padding: 10px 20px; }
  }
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header class="topbar">
  <div class="topbar-title">作品集 · 长图浏览</div>
  <div class="topbar-counter">
    <span class="current" id="currentNum">01</span>
    <span> / </span>
    <span id="totalNum">50</span>
  </div>
</header>

<!-- ===== 主查看区 ===== -->
<main class="viewer">
  <!-- 左箭头 -->
  <div class="nav-arrow left disabled" id="prevBtn" title="上一张 (←)">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </div>

  <!-- 图片滚动区 -->
  <div class="image-container" id="imageContainer">
    <div class="long-image" id="longImage">
      <span class="label" id="imageLabel">长图 01 / 50</span>
      <span class="dimensions">790 × 20000 px · 灰色占位</span>
    </div>
  </div>

  <!-- 右箭头 -->
  <div class="nav-arrow right" id="nextBtn" title="下一张 (→)">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>
</main>

<!-- 底部提示 -->
<div class="bottom-hint">使用 ← → 方向键或点击两侧箭头切换图片</div>

<script>
  (function() {
    var TOTAL = 50;
    var current = 0; // 0-based index

    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var currentNum = document.getElementById('currentNum');
    var totalNum = document.getElementById('totalNum');
    var imageLabel = document.getElementById('imageLabel');
    var imageContainer = document.getElementById('imageContainer');
    var longImage = document.getElementById('longImage');

    totalNum.textContent = String(TOTAL).padStart(2, '0');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateUI() {
      var displayNum = current + 1;
      currentNum.textContent = pad(displayNum);
      imageLabel.textContent = '长图 ' + pad(displayNum) + ' / ' + pad(TOTAL);

      // 更新箭头禁用状态
      prevBtn.classList.toggle('disabled', current === 0);
      nextBtn.classList.toggle('disabled', current === TOTAL - 1);

      // 切换时滚动回顶部
      imageContainer.scrollTop = 0;
    }

    function goPrev() {
      if (current > 0) {
        current--;
        updateUI();
      }
    }

    function goNext() {
      if (current < TOTAL - 1) {
        current++;
        updateUI();
      }
    }

    // 箭头点击
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // 键盘左右键
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goPrev();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goNext();
      }
    });

    // 触摸滑动支持（左右滑切换）
    var touchStartX = 0;
    var touchStartY = 0;
    var isHorizontalSwipe = false;

    imageContainer.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontalSwipe = false;
    }, { passive: true });

    imageContainer.addEventListener('touchmove', function(e) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      // 判断是否为水平滑动（水平位移大于垂直位移且超过阈值）
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        isHorizontalSwipe = true;
      }
    }, { passive: true });

    imageContainer.addEventListener('touchend', function(e) {
      if (isHorizontalSwipe) {
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (dx > 50) {
          goPrev(); // 向右滑 → 上一张
        } else if (dx < -50) {
          goNext(); // 向左滑 → 下一张
        }
      }
    }, { passive: true });

    // 初始化
    updateUI();
  })();
</script>

</body>
</html>
